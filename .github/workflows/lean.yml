name: Build & verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: Lean build (Mathlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Lake (uses Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Forbid sorry / new axioms
        run: |
          if grep -nE '\bsorry\b|^\s*axiom\s|native_decide' Goldbach/*.lean; then
            echo "::error::Found sorry, axiom declaration or native_decide"; exit 1
          fi

      - name: Check axioms used by the proved theorems
        run: |
          for f in Goldbach/*.lean; do
            out=$(lake env lean "$f" 2>&1)
            echo "$out" | grep "depends on axioms" || true
            if echo "$out" | grep -q sorryAx; then
              echo "::error::$f depends on sorryAx"; exit 1
            fi
          done

  small-ranks:
    name: Finite check of ranks 5 <= P <= 199 (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/check_small_ranks.py 199 13 | tee out.txt
          ! grep -q SURVIVOR out.txt
