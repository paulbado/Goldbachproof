name: Build & verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: Lean build (Mathlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Lake (uses Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Forbid sorry / new axioms
        run: |
          if grep -nE '\bsorry\b|^\s*axiom\s' Goldbach/*.lean; then
            echo "::error::Found sorry or axiom declaration"; exit 1
          fi

      - name: Check axioms used by the proved theorems
        run: |
          out=$(lake env lean Goldbach/WilliamsonMurII.lean 2>&1)
          echo "$out"
          if echo "$out" | grep -q sorryAx; then
            echo "::error::A theorem depends on sorryAx"; exit 1
          fi
